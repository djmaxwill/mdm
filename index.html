<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi.ke Landing Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Navbar -->
  <nav class="flex justify-between items-center p-6 bg-white shadow">
    <div class="text-xl font-bold text-gray-800">
        <img src="chikelogo.png" alt="" srcset="" width="100px" height="100px">
    </div>
    <div class="flex gap-4">
      <a href="#" class="text-gray-700 hover:text-purple-600">Login</a>
      <a href="#" class="bg-purple-600 text-white px-4 py-2 rounded-full hover:bg-purple-700">Join Waitlist</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="flex flex-col lg:flex-row items-center justify-between p-10 max-w-7xl mx-auto mt-8">
    <!-- Text Content -->
    <div class="lg:w-1/2 space-y-6">
      <h1 class="text-4xl lg:text-5xl font-extrabold">
        Win Big with<br />
        Our Live <span class="text-green-500">Trivia Game!</span>
      </h1>
      <p class="text-lg text-gray-700">
        Join the waitlist and get exclusive access to our live trivia challenge.
        Compete with friends, climb the leaderboard, and earn cash rewards for new sign-ups.
      </p>
      <div class="flex gap-4">
        <a href="#" class="bg-purple-600 text-white px-6 py-3 rounded-lg shadow hover:bg-purple-700">
          Join Waitlist
        </a>
        <a href="#" class="bg-white text-gray-800 px-6 py-3 rounded-lg border hover:bg-gray-200">
          Learn More
        </a>
      </div>
    </div>

    <!-- Phone Images -->
    <div class="lg:w-1/2 mt-10 lg:mt-0 flex justify-center relative">
      <!-- Replace with real image if available -->
      <img src="./doublewallet.png" alt="Phone 1" width="450px" class="transform rotate-[-10deg] z-10 relative left-6">
      <!-- <img src="../MDM/doublewallet.png" alt="Phone 2" class="w-40 md:w-56 lg:w-64 transform rotate-[10deg] -ml-10"> -->
    </div>
  </section>

</body>
</html>
